short_bio: >-
  我目前是佐治亚大学（University of Georgia）博士生，由 <a href="https://anplus.github.io/">Zhenlin An 博士</a> 和 <a href="https://esi.uga.edu/">Haijian Sun 博士</a> 联合指导。
  <br>
  此前，我于中国山东大学崇新学堂获得通信工程学士学位，由 <a href="https://yanniyang-polyu.github.io/index_english.html">Yanni Yang 教授</a> 指导。
  <br>
  我的研究兴趣包括无线感知、移动计算、无线通信、AI-native wireless 和神经收发机（neural transceiver）。
  <br>

